# FashionMNIST-Analysis Configuration File

# Model Configuration
model:
  # Custom CNNs: minicnn, tinyvgg, resnet
  # timm backbones (any timm id or alias): resnet18, resnet50, efficientnet_b0,
  #   convnext_tiny, vit_tiny, vit_small, deit_small, timm:<id>
  architecture: "resnet"
  num_classes: 10
  pretrained: true       # ImageNet weights for timm backbones (ignored by custom CNNs)
  image_size: null       # Input res for timm backbones; null = 64 for CNNs, 224 for ViT-style
  drop_rate: 0.0         # Dropout before the classifier (timm backbones)
  device: "auto" # auto, cuda, cpu, mps

# Transfer Learning Configuration
transfer_learning:
  freeze_backbone: false # Freeze pretrained weights during training
  num_frozen_layers: 0
  learning_rate: 1e-4

# Training Configuration
training:
  epochs: 75
  batch_size: 32
  learning_rate: 1e-3
  weight_decay: 1e-4
  optimizer: "adam" # adam, adamw, sgd
  scheduler: "cosine" # cosine, step, exponential, none
  early_stopping_patience: 10
  seed: 42                # Global seed (model init, shuffling, split, augmentation)
  deterministic: false    # Force deterministic kernels (slower; bit-exact repro)
  label_smoothing: 0.0    # CrossEntropy label smoothing (0.1 is a common recipe value)
  grad_clip: null         # Max gradient norm, e.g. 1.0; null = off
  amp: false              # Mixed precision on CUDA (bf16 if supported, else fp16)
  compile: false          # torch.compile the model on CUDA

# Data Configuration
data:
  dataset: "fashion_mnist"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  normalize: true
  num_workers: 0  # DataLoader workers; raise to 4-8 on a cluster node
  image_size: 224 # For transfer learning models
  grayscale_to_rgb: true # Convert 1-channel to 3-channel for pretrained models

# Data Augmentation Configuration
augmentation:
  enabled: true
  strategy: "advanced" # basic, advanced, custom

  # Per-sample geometric augmentation. Before 2026-09-27 these transforms were
  # applied once per *batch* (every image shared one crop / flip / angle) and
  # padded with 0.0, which after normalisation is mid-grey. Both are fixed;
  # set legacy_batch_mode: true (and fill: 0.0) only to reproduce old runs.
  fill: "background"        # "background" = normalised black (-0.810), or a number
  legacy_batch_mode: false

  # Geometric (standard Fashion MNIST augmentations)
  rotation: 10              # RandomRotation degrees (±) — mild
  horizontal_flip: true     # RandomHorizontalFlip
  vertical_flip: false      # RandomVerticalFlip (not useful for clothing)
  random_crop: true         # Padded random crop; helps ResNet, hurts MiniCNN/TinyVGG (see README)
  random_crop_padding: 4    # Pixels of padding (filled with augmentation.fill) before the crop
  random_affine: false      # Disabled — too aggressive for 28x28
  zoom: 0.1                 # (kept for reference, unused when random_affine: false)

  # Color / intensity — disabled: not effective for grayscale + causes divergence
  color_jitter: false
  brightness: 0.1
  contrast: 0.1

  # Noise & occlusion — disabled: too aggressive when stacked with batch mixing
  random_erasing: false
  random_erasing_prob: 0.1
  gaussian_noise: false
  gaussian_noise_std: 0.02

  # Batch-level mixing (these work well; keep both)
  mix_prob: 0.3   # Probability that a batch gets Mixup or CutMix
  cutmix: true
  cutmix_alpha: 1.0
  mixup: true
  mixup_alpha: 0.1  # Softer mixing → less label noise per batch

# Ensemble Configuration
ensemble:
  enabled: false
  method: "voting" # voting, stacking, bagging
  models: ["resnet", "vit", "efficientnet"]
  voting_strategy: "hard" # hard, soft

# Explainability Configuration
explainability:
  grad_cam_enabled: true
  shap_enabled: false # Can be slow
  attention_maps_enabled: true
  layer_for_gradcam: "layer4" # For ResNet

# Monitoring Configuration
# Every run always writes run.json + metrics.jsonl to its output directory.
# MLflow / W&B mirror the same data when enabled AND the package is installed.
monitoring:
  mlflow_tracking: false
  mlflow_tracking_uri: null   # e.g. "file:./mlruns" or "http://host:5000"
  experiment_name: "fashion-mnist"
  wandb_enabled: false
  wandb_project: "fashion-mnist"
  log_metrics: true
  log_predictions: true
  drift_detection: false

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  reload: true
  workers: 1
  max_model_size: 500 # MB

# Real-world Inference Configuration
inference:
  input_size: 224
  confidence_threshold: 0.5
  return_top_k: 3
  grayscale_to_rgb: true

# Paths Configuration
paths:
  data_dir: "./data"
  raw_data_dir: "./data/raw"
  processed_data_dir: "./data/processed"
  models_dir: "./models"
  checkpoints_dir: "./checkpoints"
  results_dir: "./results"
  logs_dir: "./logs"
  plots_dir: "./figures"

# Logging Configuration
logging:
  level: "INFO" # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/app.log"
