version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directories:
      - "/"
      - "/cluster"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: monthly
    groups:
      docker-images:
        patterns: ["*"]
